name: Python compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Type check
        run: python -m mypy src/ardguard
      - name: Test
        run: python -m pytest -q
      - name: Security-critical branch coverage
        if: matrix.python == '3.12'
        run: >-
          python -m pytest -q
          --cov=ardguard.models
          --cov=ardguard.eligibility
          --cov=ardguard.decision
          --cov=ardguard.providers.evidence
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Repository boundary
        run: python scripts/check_repository.py
      - name: Documentation and examples
        run: python scripts/check_docs.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - run: python scripts/check_package.py dist
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/ardguard-wheel
          /tmp/ardguard-wheel/bin/pip install dist/*.whl
          /tmp/ardguard-wheel/bin/ardguard --version
          /tmp/ardguard-wheel/bin/ardguard demo
      - name: Source install smoke
        run: |
          python -m venv /tmp/ardguard-sdist
          /tmp/ardguard-sdist/bin/pip install dist/*.tar.gz
          /tmp/ardguard-sdist/bin/ardguard doctor
