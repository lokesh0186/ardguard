name: Docs and Explorer

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/integrations/**"
      - "scripts/build_public_site.py"
      - "scripts/check_public_site.py"
      - "scripts/generate_site_fixtures.py"
      - "tests/test_public_site.py"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "examples/integrations/**"
      - "scripts/build_public_site.py"
      - "scripts/check_public_site.py"
      - "scripts/generate_site_fixtures.py"
      - "tests/test_public_site.py"
      - "README.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact fixture engine and test tools
        run: python -m pip install ardguard==0.1.0b4 pytest ruff
      - name: Verify Beta-4 fixtures
        run: python scripts/generate_site_fixtures.py --check
      - name: Build static site
        run: python scripts/build_public_site.py
      - name: Validate site and fixtures
        run: |
          ruff check scripts/generate_site_fixtures.py scripts/build_public_site.py scripts/check_public_site.py tests/test_public_site.py examples/integrations/semantic-kernel/test_reference.py
          python scripts/check_public_site.py build/public-site
          pytest -q tests/test_public_site.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/public-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
